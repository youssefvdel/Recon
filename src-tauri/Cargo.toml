[package]
name = "recon"
version = "0.4.4"
description = "Recon - Competitive Stretched Resolution & Utility"
authors = ["Youssef Adel <contact@reconlab.app>"]
license = "Proprietary"
repository = "https://github.com/youssefvdel/Recon"
homepage = "https://reconlab.app"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
winreg = "0.52"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_UI_Shell",
    "Win32_Security_Cryptography",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
tauri-plugin-mcp-bridge = "0.13.0"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
ini-preserve = "0.1.3"
# Riot API transport: native-tls == Schannel on Windows (OS trust store, no
# bundled TLS stack, no libclang/cmake). Replaces the per-request curl.exe spawn.
native-tls = "0.2"
tokio = { version = "=1.53.1", features = ["rt", "macros", "sync", "time", "net"] }

