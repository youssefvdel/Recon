<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons. Order matters: Google Search only rasterises ICO/PNG/JPEG/GIF and
         cannot render SVG, so the multi-size ICO is declared first and the SVG last.
         /favicon.ico carries 16/32/48/64/128/256. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Head tags mirror this page's `seo` export in src/pages/tracker.tsx. -->
    <title>Valorant Tracker — Lobby Scouting, Match History &amp; Loadouts | Recon</title>
    <meta
      name="description"
      content="Recon reads your VALORANT lobby live: ten ranked players, party detection and incognito flags. Keeps match history, per-agent and per-map stats, and a click-through HUD overlay with a full loadout viewer."
    />
    <link rel="canonical" href="https://reconlab.app/tracker/" />
    <meta name="theme-color" content="#09060d" />
    <!-- "index, follow" are the defaults and need not be stated. -->
    <meta name="robots" content="max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Recon" />
    <meta property="og:url" content="https://reconlab.app/tracker/" />
    <meta property="og:title" content="Valorant Tracker — Lobby Scouting, Match History &amp; Loadouts | Recon" />
    <meta
      property="og:description"
      content="Recon reads your VALORANT lobby live: ten ranked players, party detection and incognito flags. Keeps match history, per-agent and per-map stats, and a click-through HUD overlay with a full loadout viewer."
    />
    <meta property="og:image" content="https://reconlab.app/screenshots/live-match.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://reconlab.app/tracker/" />
    <meta name="twitter:title" content="Valorant Tracker — Lobby Scouting, Match History &amp; Loadouts | Recon" />
    <meta

      content="Recon reads your VALORANT lobby live: ten ranked players, party detection and incognito flags. Keeps match history, per-agent and per-map stats, and a click-through HUD overlay with a full loadout viewer."

    <meta name="twitter:image" content="https://reconlab.app/screenshots/live-match.png" />

      "description": "Recon reads your VALORANT lobby live: ten ranked players, party detection and incognito flags. Keeps match history, per-agent and per-map stats, and a click-through HUD overlay with a full loadout viewer.",
      "url": "https://reconlab.app/tracker/",

        "@type": "WebSite",
        "name": "Recon",

      },

        "name": "Recon",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Windows 10, Windows 11"
