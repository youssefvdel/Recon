[package]
name = "outpeek-overlay"
version = "0.4.4"
description = "Outpeek native overlay sidecar (Slint HUD, driven by the main app over stdin NDJSON)"
authors = ["Youssef Adel <contact@reconlab.app>"]
license = "Proprietary"
edition = "2021"
rust-version = "1.85.0"

[[bin]]
name = "outpeek-overlay"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"

[dependencies]
# Pinned backend: winit + FemtoVG-over-wgpu (DX12 on Windows). The OpenGL
# path is proven blocked on the target machine (NVIDIA ICD refuses
# wglMakeCurrent, 0xC0070006), so GL is out entirely. The software renderer
# is deliberately not compiled in (no default features) so a broken GPU path
# fails closed instead of silently going opaque (Slint #9507/#4120).
slint = { version = "1.18", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg-wgpu",
    "compat-1-2",
    "raw-window-handle-06",
    "unstable-fontique-011",
    # Embedded MCP server (Streamable HTTP) for UI introspection/driving.
    # Inert unless SLINT_MCP_PORT / --mcp-port is set at runtime.
    "mcp",
] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Agent icons / rank crests decode (URL bytes are cached to disk by the main
# app; the sidecar only ever loads local files through here).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }

[dev-dependencies]
filetime = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
